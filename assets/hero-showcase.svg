  <text x="100" y="53" fill="#F3F4F8" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700">Antigravity Theme Studio</text>
  <text x="100" y="74" fill="#949BA8" font-family="system-ui, -apple-system, sans-serif" font-size="13">14 Curated Palettes · Visual Color Mixer · Auto Day/Night · Procedural Wallpapers · Zero-Patch</text>

