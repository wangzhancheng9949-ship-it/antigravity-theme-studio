    <text x="162" y="140" fill="#7C6BF0" font-family="Consolas, monospace" font-size="11.5">const</text>
    <text x="202" y="140" fill="#E6E8F0" font-family="Consolas, monospace" font-size="11.5">palette = { bg: "#0F1014", accent: "#7C6BF0" };</text>
