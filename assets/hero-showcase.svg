    <rect x="148" y="202" width="370" height="34" rx="10" fill="#262638" stroke="#CBA6F7" stroke-opacity="0.28"/>
    <rect x="466" y="208" width="44" height="22" rx="6" fill="#CBA6F7"/>
    <text x="488" y="223" text-anchor="middle" fill="#181825" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">Send</text>
