      <stop offset="0%" stop-color="#0B0C10"/>
      <stop offset="50%" stop-color="#12141E"/>
      <stop offset="100%" stop-color="#0D1017"/>
    </linearGradient>
    <radialGradient id="topGlow" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#7C6BF0" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#7C6BF0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
